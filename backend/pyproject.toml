[project]
name = "live-paper-trading-backend"
version = "0.1.0"
description = "Backend for live paper trading simulation using market and news data"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "yfinance>=0.2.44",
  "requests>=2.32.0",
  "feedparser>=6.0.11",
  "vaderSentiment>=3.3.2",
  "alpaca-py>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
